<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Jeopardy game built with vanilla JavaScript" />
    <title>Jeppy</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-deep-navy: #0a0e27;
            --color-rich-blue: #1a1f4e;
            --color-accent-blue: #2d3a8c;
            --color-gold: #d4af37;
            --color-gold-bright: #f4d03f;
            --color-white: #ffffff;
            --color-text-muted: #a8b2d1;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-medium: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .fullscreen-background {
            background-image: url('./img/jeppy.webp');
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .fullscreen-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(10, 14, 39, 0.3), transparent);
            pointer-events: none;
        }

        .fullscreen-background button {
            width: auto;
            align-self: center;
            position: relative;
            z-index: 1;
        }

        .App {
            text-align: center;
            color: var(--color-white);
            min-height: 100vh;
            height: 100%;
            background: linear-gradient(135deg, var(--color-deep-navy) 0%, var(--color-rich-blue) 100%);
            background-attachment: fixed;
        }

        #app {
            height: 100vh;
        }

        .flex-box-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .flex-box-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .Jeopardy-box {
            background: linear-gradient(145deg, #1e2555 0%, #0f1435 100%);
            min-width: 30em;
            max-width: 50em;
            border: 3px solid rgba(212, 175, 55, 0.4);
            border-radius: 4px;
            box-shadow: var(--shadow-strong),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .Jeopardy-box:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-strong),
                        0 16px 64px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .greg-image {
            width: 20%;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .score-display {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeOut 1s forwards, shimmer 2s ease-in-out;
            letter-spacing: 0.05em;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .table {
            color: var(--color-white);
            background-color: rgba(26, 31, 78, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        .table thead th {
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        .table-dark {
            background-color: rgba(26, 31, 78, 0.8);
        }

        .table-dark tbody tr:hover {
            background-color: rgba(45, 58, 140, 0.3);
        }

        /* Jeopardy card styles */
        .jeopardy-category {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2em;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .jeopardy-year {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9em;
            font-weight: 400;
            color: var(--color-text-muted);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .jeopardy-card-header {
            height: 7em;
            background: linear-gradient(to bottom, rgba(45, 58, 140, 0.3), transparent);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .jeopardy-card-content {
            min-height: 18em;
            overflow-y: auto;
            padding: 2em 1.5em;
        }

        .jeopardy-question-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8em;
            font-weight: 400;
            line-height: 1.5;
            padding: 0.5em;
            color: var(--color-white);
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Game view styles */
        .game-form {
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .game-form input.form-control {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1em;
            padding: 0.75em 1.25em;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            color: var(--color-white);
            transition: all 0.3s ease;
            min-width: 300px;
        }

        .game-form input.form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--color-gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .game-form input.form-control::placeholder {
            color: var(--color-text-muted);
        }

        .btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.75em 1.75em;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.9em;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-gold) 0%, #c9a134 100%);
            color: var(--color-deep-navy);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--color-gold-bright) 0%, var(--color-gold) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(168, 178, 209, 0.2);
            color: var(--color-white);
            border: 1px solid rgba(168, 178, 209, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(168, 178, 209, 0.3);
            border-color: rgba(168, 178, 209, 0.6);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #2d8659 0%, #1f5d3f 100%);
            color: var(--color-white);
            box-shadow: 0 4px 12px rgba(45, 134, 89, 0.3);
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #36a16a 0%, #2d8659 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 134, 89, 0.4);
        }

        .btn-outline-danger {
            background: transparent;
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }

        .btn-outline-danger:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: #e74c3c;
            color: #ff6b5a;
        }

        .btn-outline-secondary {
            background: transparent;
            color: var(--color-text-muted);
            border: 1px solid rgba(168, 178, 209, 0.3);
        }

        .btn-outline-secondary:hover {
            background: rgba(168, 178, 209, 0.1);
            border-color: rgba(168, 178, 209, 0.5);
            color: var(--color-white);
        }

        .game-message {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .game-message .h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 2em;
            color: var(--color-gold-bright);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-in;
        }

        .game-score {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .game-score .h4 {
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
            font-size: 1.2em;
            color: var(--color-text-muted);
            line-height: 1.8;
        }

        /* Play button styles */
        .play-button {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8em;
            font-weight: 700;
            padding: 0.875em 2.5em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--color-gold) 0%, #c9a134 100%);
            color: var(--color-deep-navy);
            border: none;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            position: relative;
            overflow: hidden;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .play-button:hover::before {
            left: 100%;
        }

        .play-button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
        }

        /* Container styles for summary */
        .container {
            max-width: 1200px;
            padding: 2rem;
        }

        .container p {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2em;
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        /* Smooth scrollbar */
        .jeopardy-card-content::-webkit-scrollbar {
            width: 8px;
        }

        .jeopardy-card-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .jeopardy-card-content::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 4px;
        }

        .jeopardy-card-content::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="app.js"></script>
</body>
</html>
